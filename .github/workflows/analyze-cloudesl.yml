name: Analyze CloudESL APK

on:
  push:
    paths:
      - ".github/workflows/analyze-cloudesl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK and JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 3 "https://github.com/inforli/cloudesl-apk/releases/download/v1.0.23/cloudesl-release-v1.0.23.apk" -o work/cloudesl.apk
          echo "APK_SHA256=$(sha256sum work/cloudesl.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip" -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx
          work/jadx/bin/jadx --version
          set +e
          work/jadx/bin/jadx -d work/decompiled work/cloudesl.apk 2>&1 | tee work/jadx.log
          JADX_EXIT=${PIPESTATUS[0]}
          set -e
          echo "JADX_EXIT=$JADX_EXIT" >> "$GITHUB_ENV"
          echo "JADX returned $JADX_EXIT; retaining partial decompilation output for analysis."

      - name: Scan APK native libraries and DEX strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis work/native
          python3 - <<'PY'
          import zipfile, pathlib, re, subprocess
          apk=pathlib.Path("work/cloudesl.apk")
          out=["# CloudESL APK native / DEX 字符串扫描","","用于排查 JADX Java 层未覆盖的 native SDK、动态模块和隐藏 BLE 实现。",""]
          needles=re.compile(r"bluetooth|BluetoothGatt|BluetoothLeScanner|gatt|DA14585|Dialog Semiconductor|Renesas|\bESL\b|e.?paper|zigbee|gateway|mqtt|characteristic|scanRecord|connectGatt|writeCharacteristic|notifyCharacteristic|cloudesl",re.I)
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              so=[n for n in names if n.endswith(".so")]
              dex=[n for n in names if re.fullmatch(r"classes(?:\d+)?\.dex",n)]
              out += [f"- APK 内 native 库数量：{len(so)}",f"- DEX 文件数量：{len(dex)}",""]
              out += ["## Native libraries",""]
              out += [f"- {n}" for n in so] or ["- 未发现 .so 文件"]
              out += ["","## Native library strings 命中",""]
              for n in so:
                  data=z.read(n)
                  strings=re.findall(rb"[\x20-\x7e]{5,}",data)
                  hits=[x.decode("latin1","replace") for x in strings if needles.search(x.decode("latin1","ignore"))]
                  if hits:
                      out.append("### "+n)
                      out.extend("- "+x[:300] for x in hits[:150])
              out += ["","## DEX 字符串命中",""]
              for n in dex:
                  data=z.read(n)
                  strings=re.findall(rb"[\x20-\x7e]{5,}",data)
                  hits=[x.decode("latin1","replace") for x in strings if needles.search(x.decode("latin1","ignore"))]
                  out.append(f"### {n}（命中 {len(hits)}）")
                  out.extend("- "+x[:300] for x in hits[:250])
          pathlib.Path("analysis/native_dex_scan.md").write_text("\n".join(out),encoding="utf-8")
          print("Wrote native/DEX scan")
          PY

      - name: Extract BLE findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("work/decompiled")
          out = []
          out.append("# CloudESL APK v1.0.23 — BLE 静态分析初筛")
          out.append("")
          out.append(f"- APK SHA-256: {__import__('os').environ.get('APK_SHA256','unknown')}")
          out.append("- 工具：JADX 1.5.1")
          out.append("")
          patterns = [
              re.compile(r"bluetooth|\\bble\\b|gatt|esl|价签|蓝牙|gateway|\\bap\\b|uuid|scan|connect|characteristic|write|tag|device|label|display|image|bitmap|商品|货架", re.I),
          ]
          hits = 0
          files = 0
          app_root = root / "sources" / "com" / "aliyun" / "cloudesl" / "android"
          out.append("## Android Manifest 权限与组件")
          manifest = root / "resources" / "AndroidManifest.xml"
          if manifest.exists():
              for i, line in enumerate(manifest.read_text(errors="ignore").splitlines()):
                  if re.search(r"permission|service|receiver|uses-feature", line, re.I):
                      out.append(f"- L{i+1}: {line.strip()[:1000]}")
          out.append("")
          out.append("## CloudESL 应用自身代码关键词")
          scan_roots = [app_root] if app_root.exists() else [root / "sources"]
          for scan_root in scan_roots:
              for p in scan_root.rglob("*.java"):
                  try: lines = p.read_text(errors="ignore").splitlines()
                  except Exception: continue
                  matched = [(i, line.strip()) for i, line in enumerate(lines) if any(rx.search(line) for rx in patterns)]
                  if matched:
                      files += 1
                      hits += len(matched)
                      out.append(f"### {p.relative_to(root)}")
                      for i, line in matched[:60]:
                          out.append(f"- L{i+1}: {line[:700]}")
                      if len(matched) > 60:
                          out.append(f"- ... 另有 {len(matched)-60} 条匹配")
                      out.append("")
          out.insert(4, f"- 应用自身代码命中文件数: {files}")
          out.insert(5, f"- 应用自身代码命中行数: {hits}")
          (Path("analysis") / "ble_report.md").write_text("\n".join(out), encoding="utf-8")
          print(f"Wrote report with {hits} matching lines")
          detail = []
          detail.append("# CloudESL 云端 API 代码摘录")
          detail.append("")
          targets = [
              root / "sources" / "com" / "aliyun" / "cloudesl" / "android" / "api" / "AliyunOAuth.java"
          ]
          sdk = root / "sources" / "com" / "aliyuncs" / "cloudesl" / "model" / "v20200201"
          if sdk.exists():
              targets.extend(sorted(sdk.glob("*Esl*Request.java")))
              targets.extend(sorted(sdk.glob("*Esl*Response.java")))
              targets.extend(sorted(sdk.glob("*Light*Request.java")))
              targets.extend(sorted(sdk.glob("*Light*Response.java")))
          seen = set()
          for p in targets:
              if not p.exists() or p in seen:
                  continue
              seen.add(p)
              detail.append(f"## {p.relative_to(root)}")
              try: lines = p.read_text(errors="ignore").splitlines()
              except Exception: continue
              for i, line in enumerate(lines[:500]):
                  detail.append(f"- L{i+1}: {line[:1000]}")
              detail.append("")
          (Path("analysis") / "cloud_api_detail.md").write_text("\\n".join(detail), encoding="utf-8")
          print(f"Wrote API detail for {len(seen)} source files")
          PY

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/*.md
          git commit -m "Add CloudESL APK BLE analysis report" || exit 0
          git push
